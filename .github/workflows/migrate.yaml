name: DB Migration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Migration target environment"
        required: true
        type: choice
        options:
          - dev
          - prod

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  migrate:
    name: Run DB Migration (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment == 'prod' && 'Production' || 'Development' }}
    permissions:
      id-token: write
      contents: read
    env:
      MIGRATION_NAME: ${{ vars.ENV }}-${{ vars.APP_NAME }}-migration
      MIGRATION_CLUSTER: ${{ vars.ENV }}-${{ vars.APP_NAME }}-migration-cluster
    steps:
      - uses: actions/checkout@v5
        name: Checkout code

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push migration image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ env.MIGRATION_NAME }}
        run: |
          IMAGE_URI="$REGISTRY/$REPOSITORY:${{ github.sha }}"
          IMAGE_LATEST="$REGISTRY/$REPOSITORY:latest"
          docker build \
            --target migrate \
            -t "$IMAGE_URI" \
            -t "$IMAGE_LATEST" \
            -f backend/docker/Dockerfile \
            backend/
          docker push "$IMAGE_URI"
          docker push "$IMAGE_LATEST"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Run ECS migration task
        id: run-task
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.MIGRATION_CLUSTER }} \
            --task-definition ${{ env.MIGRATION_NAME }} \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={
              subnets=[${{ vars.PRIVATE_SUBNET_IDS }}],
              securityGroups=[${{ vars.MIGRATION_SG_ID }}],
              assignPublicIp=DISABLED
            }" \
              --query 'tasks[0].taskArn' \
            --output text)
          echo "task-arn=$TASK_ARN" >> $GITHUB_OUTPUT
          echo "Started ECS task: $TASK_ARN"

      - name: Wait for task to complete
        run: |
          aws ecs wait tasks-stopped \
            --cluster ${{ env.MIGRATION_CLUSTER }} \
            --tasks "${{ steps.run-task.outputs.task-arn }}"

      - name: Check task exit code
        run: |
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ env.MIGRATION_CLUSTER }} \
            --tasks "${{ steps.run-task.outputs.task-arn }}" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)
          echo "Container exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            REASON=$(aws ecs describe-tasks \
              --cluster ${{ env.MIGRATION_CLUSTER }} \
              --tasks "${{ steps.run-task.outputs.task-arn }}" \
              --query 'tasks[0].stoppedReason' \
              --output text)
            echo "Task stopped reason: $REASON"
            exit 1
          fi
          echo "Migration succeeded"
