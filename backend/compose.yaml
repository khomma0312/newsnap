services:
  backend:
    container_name: newsnap-backend
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - ~/.aws:/home/node/.aws:ro
      - backend_node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      - AWS_PROFILE=admin
      - AWS_REGION=ap-northeast-1
    depends_on:
      - db
  db:
    image: postgres:15.18
    environment:
      POSTGRES_USER: newsnap
      POSTGRES_PASSWORD: newsnap
      POSTGRES_DB: newsnap
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
  backend_node_modules: